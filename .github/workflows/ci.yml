---
name: CI

on:
  pull_request:
    paths:
      - "manifests/**"
      - "templates/**"
      - "tasks/**"
      - "tests/**"
      - "lib/**"
      - "files/**"
      - "facts.d/**"
      - "spec/**"
      - "metadata.json"
      - "Gemfile"
      - "tools/supplychain/**"
      - ".gitleaks.toml"
      - "supplychain.waivers.json"
      - ".github/workflows/**"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      beaker_staging_url:
        description: URL to a staging server for unreleased AIO packages.
        required: false
        type: string
        default: "https://artifacts.voxpupuli.org/openvox-agent"
      beaker_collection:
        description: Optional collection override (puppet7, puppet8, openvox8, openvox9, or staging).
        required: false
        type: string
      beaker_staging_version:
        description: Package version used when beaker_collection is staging.
        required: false
        type: string

permissions:
  contents: read

jobs:
  security-scan:
    name: Security
    uses: ./.github/workflows/security-scan.yml

  lint:
    name: Lint / validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: puppet-lint + syntax + metadata-json-lint
        run: bundle exec rake validate lint metadata_lint

  unit-test:
    name: rspec-puppet (${{ matrix.label }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Real, resolvable releases -- these block the PR.
          - label: "Puppet Core 7"
            gem_name: puppet
            gem_version: "~> 7.0"
            # 3.2, not puppet 7's own minimum (Ruby >= 2.5) -- the fixed
            # (non-matrix) rspec-puppet-facts ~> 6.1 dependency in Gemfile
            # requires Ruby >= 3.2 regardless of which Puppet is under
            # test; this is pure test-tooling parsing the DSL, not a live
            # agent run, so it's independent of Puppet 7's own Ruby floor.
            ruby_version: "3.2"
            experimental: false
          - label: "Puppet Core 8"
            gem_name: puppet
            gem_version: "~> 8.0"
            ruby_version: "3.2"
            experimental: false
          - label: "OpenVox 8"
            gem_name: openvox
            gem_version: "~> 8.0"
            ruby_version: "3.2"
            experimental: false
          # Puppet 9 has not shipped on RubyGems as of this workflow's
          # authoring (2026-08-21; latest published `puppet` gem is
          # 8.10.0) -- this leg is real and wired in, but can only start
          # passing once Puppet 9 actually ships. experimental: true so it
          # never blocks a PR in the meantime; watch it turn green.
          - label: "Puppet Core 9 (experimental -- not yet released)"
            gem_name: puppet
            gem_version: "~> 9.0"
            ruby_version: "3.2"
            experimental: true
          # OpenVox 9 exists only as a pre-release (9.0.0-beta2 at pin
          # time) -- forward-compat signal, not a support commitment.
          - label: "OpenVox 9 (experimental -- pre-release)"
            gem_name: openvox
            gem_version: ">= 9.0.0.beta1"
            ruby_version: "3.2"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    env:
      CI_PUPPET_GEM_NAME: ${{ matrix.gem_name }}
      CI_PUPPET_GEM_VERSION: ${{ matrix.gem_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby_version }}

      - name: bundle install (fresh per matrix leg)
        # Each leg resolves its own gem graph for CI_PUPPET_GEM_NAME/
        # VERSION -- the committed Gemfile.lock stays the local-dev default
        # (Puppet 8.10) and is never touched here.
        run: |
          rm -f Gemfile.lock
          bundle install --jobs 4 --retry 3

      - name: rspec-puppet
        # fixtures:prep (not the modulesync-managed spec_prep shim, which
        # only mkdir's spec/fixtures -- it doesn't fetch anything) is the
        # real task in this voxpupuli-test/puppet_fixtures toolchain that
        # installs .fixtures.yml's declared Forge modules (stdlib/docker/
        # apt/yumrepo_core), matching what a clean CI checkout actually needs.
        run: bundle exec rake fixtures:prep spec:standalone

  task-tests:
    name: Bolt task shell tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run tasks/*_test.sh and tests/*.sh
        run: |
          set -eu
          status=0
          for t in tasks/*_test.sh tests/*.sh; do
            [ -f "$t" ] || continue
            echo "== $t =="
            sh "$t" || status=1
          done
          exit "$status"

  # FORGE-01: `pdk build` packages metadata.json + the module's declared
  # files into an installable tarball independent of `pdk validate`'s
  # compatibility gate. `pdk validate` is NOT wired in here -- it
  # unconditionally fails with "This module is not PDK compatible" against
  # this repo's voxpupuli/modulesync toolchain (Gemfile/Rakefile), and
  # `pdk convert --force` destroys that working toolchain (same documented,
  # shared gap as puppet-stagehand/patchbot, trivy, and openscap -- see
  # 04.1-03/04/05-SUMMARY.md). Inspects the resulting tarball's name/
  # version/file manifest so a malformed or incomplete package fails CI
  # instead of only surfacing at publish time.
  pdk-build-and-package:
    name: PDK build + package inspection (FORGE-01)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install PDK (apt.puppet.com, sha256-pinned repo package)
        run: |
          set -euo pipefail
          curl -fsSL https://apt.puppet.com/puppet-tools-release-noble.deb -o /tmp/puppet-tools-release.deb
          echo "9c077ffd3a3c1802d04f3623dfcb8eb0ae7486fe29f2053a2ce9aa1cc3b59383  /tmp/puppet-tools-release.deb" | sha256sum -c -
          sudo dpkg -i /tmp/puppet-tools-release.deb
          sudo apt-get update
          sudo apt-get install -y pdk=3.4.0.1-1noble

      - name: pdk build
        run: pdk build --force

      - name: Inspect built package (name, version, expected file manifest)
        run: |
          set -eu
          name=$(jq -r '.name' metadata.json)
          version=$(jq -r '.version' metadata.json)
          pkg="pkg/${name}-${version}.tar.gz"
          [ -f "$pkg" ] || { echo "::error::expected package not found: $pkg"; exit 1; }
          echo ">>> package: $pkg"
          sha256sum "$pkg"
          echo ">>> manifest:"
          tar tzf "$pkg" | sed -n '1,50p'
          tar tzf "$pkg" | grep -q "${name}-${version}/metadata.json" \
            || { echo "::error::package is missing metadata.json at its expected path"; exit 1; }
          tar tzf "$pkg" | grep -q "${name}-${version}/manifests/console_integration.pp" \
            || { echo "::error::package is missing manifests/console_integration.pp"; exit 1; }
          tar tzf "$pkg" | grep -q "${name}-${version}/tasks/recert.json" \
            || { echo "::error::package is missing tasks/recert.json"; exit 1; }
          tar tzf "$pkg" | grep -q "${name}-${version}/files/json_escape.sh" \
            || { echo "::error::package is missing files/json_escape.sh"; exit 1; }
          tar tzf "$pkg" | grep -q "${name}-${version}/files/webhook-cutover.sh" \
            || { echo "::error::package is missing files/webhook-cutover.sh"; exit 1; }

  # POLISH-03: REFERENCE.md must be generated, committed, and never allowed
  # to silently drift from the manifests/tasks/functions it documents.
  reference-drift:
    name: REFERENCE.md drift gate (POLISH-03)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Regenerate REFERENCE.md and fail on drift
        run: |
          bundle exec puppet strings generate --format markdown
          git diff --exit-code -- REFERENCE.md

  # Non-blocking pending platform-lock evidence promotion: metadata.json's
  # `operatingsystem_support` stays `[]` by design (README "Platform lock
  # contract and support evidence"; enforced by the committed
  # spec/data/platform_contract_spec.rb and
  # spec/classes/platform_lock_observe_spec.rb specs, which fail if this
  # module tries to populate the list without schema-valid live deployment
  # evidence). With zero declared OS entries, voxpupuli/gha-puppet's
  # reusable beaker.yml generates zero acceptance matrix legs per
  # collection, so its "Test suite" sub-job always reports failure/skip --
  # not a real regression, just a structurally-empty job. `continue-on-error`
  # is NOT valid on a job that `uses:` a reusable workflow (GitHub Actions
  # rejects it at parse time), so this mirrors the exact treatment already
  # applied to `openvox9-beta` below instead: leave the calling job itself
  # unmodified and add a trailing `-gate` job (`if: always()`) that always
  # succeeds and reports the underlying result. Keep the job wired in (so
  # it starts reporting real green/red the moment the platform-lock
  # contract is legitimately promoted out of `[]` via
  # apply-platform-support-evidence.sh, no workflow edit required at that
  # point) and treat only `package-resolution-gate` -- not the raw
  # `package-resolution` / Test suite legs -- as a required check.
  # Decision: human call, 2026-08-27 (see pcm phase 04.1 stagehand.json
  # ci_remediation escalation) -- option A (accept legs as non-required),
  # explicitly NOT touching metadata.json or the platform-lock contract
  # tests.
  package-resolution:
    name: ${{ matrix.collection }} dependency resolution
    strategy:
      fail-fast: false
      matrix:
        collection:
          - puppet7
          - puppet8
          - openvox8
    uses: voxpupuli/gha-puppet/.github/workflows/beaker.yml@v4
    with:
      beaker_staging_url: ${{ inputs.beaker_staging_url }}
      beaker_collection: ${{ inputs.beaker_collection || matrix.collection }}
      beaker_staging_version: ${{ inputs.beaker_staging_version }}

  package-resolution-gate:
    name: dependency resolution (acceptance) — gate
    needs: package-resolution
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: echo "package-resolution result was ${{ needs.package-resolution.result }} (non-blocking by design -- see platform lock contract in README)"

  openvox9-beta:
    name: openvox9 dependency resolution (beta, best-effort)
    uses: voxpupuli/gha-puppet/.github/workflows/beaker.yml@v4
    with:
      beaker_staging_url: ${{ inputs.beaker_staging_url }}
      beaker_collection: openvox9
      beaker_staging_version: ${{ inputs.beaker_staging_version }}

  openvox9-beta-gate:
    name: openvox9 dependency resolution (beta, best-effort) — gate
    needs: openvox9-beta
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: echo "openvox9-beta result was ${{ needs.openvox9-beta.result }} (non-blocking by design)"
